name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/elixir.yml

  publish:
    name: Publish to Hex
    needs: ci
    runs-on: ubuntu-22.04
    env:
      ImageOS: ubuntu22
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Install dependencies
        run: mix deps.get
      - name: Publish package
        run: mix hex.publish package --yes

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --generate-notes
